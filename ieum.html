<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이음브릿지 — 경험을 잇고, 다음 성장으로</title>
<link rel="icon" href="assets/site/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1f4d3a; --forest-2:#2f6b52; --leaf:#5f9e6e; --sprout:#cfe3c9;
    --gold:#c8963e; --gold-soft:#f4e6c8; --cream:#faf6ee; --paper:#ffffff;
    --ink:#1d2421; --ink-2:#4b5652; --line:#e6e0d2;
    --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
  a{color:var(--forest-2)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}
  section{padding:88px 0}
  .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:14px}
  h2{font-family:var(--serif);font-size:clamp(26px,3.6vw,38px);line-height:1.35;color:var(--forest);margin-bottom:18px;font-weight:900}
  h3{font-family:var(--serif);font-size:20px;color:var(--forest);margin-bottom:8px}
  .lead{font-size:18px;color:var(--ink-2);max-width:720px}
  .muted{color:var(--ink-2);font-size:14px}

  /* NAV */
  nav{position:sticky;top:0;z-index:20;background:rgba(250,246,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{font-family:var(--serif);font-weight:900;color:var(--forest);font-size:18px;text-decoration:none;display:flex;gap:8px;align-items:center}
  nav ul{display:flex;gap:22px;list-style:none;font-size:14px}
  nav ul a{text-decoration:none;color:var(--ink-2)}
  nav ul a:hover{color:var(--forest)}
  .back{font-size:14px;text-decoration:none;color:var(--ink-2);white-space:nowrap}
  .back:hover{color:var(--forest)}
  @media(max-width:760px){nav ul{display:none}}

  /* HERO */
  .hero{background:radial-gradient(1200px 500px at 85% -10%,#2f6b52 0%,transparent 60%),linear-gradient(160deg,#173d2e 0%,#1f4d3a 55%,#2a5d46 100%);color:#fff;padding:110px 0 120px;position:relative;overflow:hidden}
  .hero .eyebrow{color:var(--gold-soft)}
  .hero h1{font-family:var(--serif);font-size:clamp(38px,6.5vw,68px);line-height:1.2;font-weight:900;margin-bottom:22px}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{font-size:clamp(17px,2vw,20px);color:#dfeee3;max-width:640px}
  .hero .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
  .tag{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 16px;font-size:14px;color:#eaf4ec}
  .hero svg.tree{position:absolute;right:-40px;bottom:-20px;width:420px;opacity:.16}
  @media(max-width:760px){.hero svg.tree{width:260px;right:-60px}}
  .meta{margin-top:40px;font-size:13px;color:#a9cbb4}

  /* PROMISE */
  .promise{background:var(--paper)}
  .promise-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
  .p-card{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:28px}
  .p-card .ico{width:46px;height:46px;border-radius:12px;background:var(--sprout);display:grid;place-items:center;margin-bottom:16px;font-size:22px}
  @media(max-width:860px){.promise-grid{grid-template-columns:1fr}}

  /* QUOTE */
  .quote{background:var(--gold-soft);padding:64px 0;text-align:center}
  .quote blockquote{font-family:var(--serif);font-size:clamp(22px,3vw,30px);color:var(--forest);line-height:1.5;max-width:820px;margin:0 auto}
  .quote cite{display:block;margin-top:14px;font-style:normal;color:var(--ink-2);font-size:14px}

  /* PROOF */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:40px 0 28px}
  .stat{background:var(--paper);border-radius:16px;padding:24px;border:1px solid var(--line)}
  .stat b{display:block;font-family:var(--serif);font-size:36px;color:var(--forest);line-height:1.1}
  .stat span{font-size:14px;color:var(--ink-2)}
  @media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}
  .cases{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .case{background:var(--paper);border-radius:18px;padding:28px;border-left:5px solid var(--leaf)}
  .case.alt{border-left-color:var(--gold)}
  .case .path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0;font-size:13px}
  .case .path span{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  .case .path i{color:var(--gold);font-style:normal}
  .case .so{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:15px}
  .case .so b{color:var(--forest)}
  @media(max-width:860px){.cases{grid-template-columns:1fr}}

  /* FORMULA */
  .formula{background:var(--forest);color:#fff}
  .formula h2{color:#fff}
  .formula .lead{color:#cfe3d5}
  .f-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
  .f-item{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:24px}
  .f-item .n{font-family:var(--serif);color:var(--gold);font-size:28px;font-weight:900}
  .f-item h3{color:#fff;font-size:18px}
  .f-item p{color:#cfe3d5;font-size:15px}
  @media(max-width:860px){.f-grid{grid-template-columns:1fr}}

  /* MODEL */
  .model-svg{width:100%;height:auto;margin-top:36px;background:var(--paper);border-radius:20px;border:1px solid var(--line)}
  .gov{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}
  .gov div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:15px}
  .gov b{color:var(--forest)}
  @media(max-width:760px){.gov{grid-template-columns:1fr}}

  /* REVENUE LADDER */
  .ladder{margin-top:36px;display:grid;gap:12px}
  .rung{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 22px}
  .rung .stage{font-family:var(--serif);font-weight:700;color:var(--forest);font-size:15px}
  .rung .stage small{display:block;font-family:var(--sans);font-weight:400;color:var(--ink-2);font-size:12px}
  .rung h3{font-size:17px;margin:0}
  .rung p{font-size:14px;color:var(--ink-2)}
  .rung .req{font-size:12px;background:var(--gold-soft);color:#7a5a1d;border-radius:999px;padding:4px 12px;white-space:nowrap}
  .rung.s2{margin-left:4%} .rung.s3{margin-left:8%}
  @media(max-width:760px){.rung{grid-template-columns:1fr}.rung.s2,.rung.s3{margin-left:0}}

  /* ROADMAP */
  .road{position:relative;margin-top:44px;padding-left:34px}
  .road:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:3px;background:linear-gradient(var(--leaf),var(--gold));border-radius:3px}
  .phase{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px}
  .phase:before{content:"";position:absolute;left:-30px;top:26px;width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--leaf)}
  .phase .when{font-size:13px;color:var(--gold);font-weight:700}
  .phase h3{margin:2px 0 6px}
  .phase p{font-size:15px;color:var(--ink-2)}
  .gate{position:relative;margin:0 0 14px;padding:12px 18px;border-radius:12px;background:var(--gold-soft);font-size:14px;color:#6b4e17}
  .gate:before{content:"";position:absolute;left:-29px;top:14px;width:13px;height:13px;background:var(--gold);transform:rotate(45deg)}
  .gate b{color:#5a3f0e}

  /* LEGACY */
  .legacy{background:var(--paper)}
  .relay{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch;margin-top:40px}
  .relay .r{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
  .relay .r .big{font-size:30px}
  .relay .r h3{font-size:17px;margin-top:8px}
  .relay .r p{font-size:14px;color:var(--ink-2)}
  .relay .arrow{display:grid;place-items:center;color:var(--gold);font-size:26px}
  @media(max-width:860px){.relay{grid-template-columns:1fr}.relay .arrow{transform:rotate(90deg)}}

  /* RISKS */
  .risks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:36px}
  .risk{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
  .risk h3{font-size:16px;font-family:var(--sans);font-weight:700}
  .risk p{font-size:14px;color:var(--ink-2)}
  .risk .fix{margin-top:8px;font-size:14px;color:var(--forest)}
  .risk .fix:before{content:"→ ";color:var(--gold);font-weight:700}
  @media(max-width:760px){.risks{grid-template-columns:1fr}}

  /* ASK */
  .ask{background:linear-gradient(160deg,#173d2e,#2a5d46);color:#fff}
  .ask h2{color:#fff}
  .ask .lead{color:#d5e8db}
  .ask-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:36px}
  .box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:28px}
  .box h3{color:var(--gold-soft);font-family:var(--sans);font-size:16px;font-weight:700;margin-bottom:14px}
  .box ol,.box ul{padding-left:20px;color:#e6f1e9;font-size:15px}
  .box li{margin-bottom:8px}
  .founders{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .founders span{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-size:14px}
  .founders span.lead-f{background:var(--gold);color:#2b2108;font-weight:700}
  @media(max-width:860px){.ask-grid{grid-template-columns:1fr}}

  footer{padding:48px 0;font-size:13px;color:var(--ink-2)}
  footer h4{font-size:14px;color:var(--forest);margin-bottom:10px}
  footer ul{columns:2;padding-left:18px}
  footer li{margin-bottom:4px;break-inside:avoid}
  @media(max-width:760px){footer ul{columns:1}}
  .disclaimer{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

  @media print{
    nav{display:none} section{padding:40px 0;break-inside:avoid}
    .hero,.formula,.ask{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  /* IEUM — 표·단계·강조 (simda.html 스타일 위에 덧붙임) */
  :root{--forest:#1d3f63;--forest-2:#2d5f8f;--leaf:#4f8fc0;--sprout:#d6e6f3}
  .hero{background:radial-gradient(1200px 500px at 85% -10%,#2d5f8f 0%,transparent 60%),linear-gradient(160deg,#132c46 0%,#1d3f63 55%,#284f78 100%)}
  .hero p{color:#dbe8f4} .meta{color:#a9c3dc} .tag{color:#e7f0f8}
  .doc h3{margin:34px 0 12px}
  .doc p{margin:12px 0;color:var(--ink-2)} .doc p b{color:var(--ink)}
  .tbl{overflow-x:auto;margin:14px 0;background:var(--paper);border:1px solid var(--line);border-radius:14px}
  .tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
  .tbl th{background:var(--sprout);color:var(--forest);text-align:left;padding:10px 14px;font-weight:700;white-space:nowrap}
  .tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
  .tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
  .note{font-size:14px;color:var(--ink-2);background:var(--paper);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;margin:12px 0}
  .callout{font-family:var(--serif);font-size:19px;color:var(--forest);background:var(--gold-soft);border-radius:14px;padding:22px 26px;margin:28px 0 0;line-height:1.6}
  .doc ul,.doc ol{padding-left:22px;margin:10px 0;color:var(--ink-2)} .doc li{margin-bottom:6px}
  .steps{display:grid;gap:10px;margin:14px 0}
  .step{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--leaf);border-radius:12px;padding:14px 18px}
  .step .when{font-weight:700;color:var(--forest);font-size:14px}
  .step .out{font-size:12px;background:var(--gold-soft);color:#7a5a1d;border-radius:999px;padding:4px 12px}
  @media(max-width:760px){.step{grid-template-columns:1fr}}
  section:nth-of-type(even){background:var(--paper)}
  section:nth-of-type(even) .tbl,section:nth-of-type(even) .step,section:nth-of-type(even) .note{background:var(--cream)}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center">불러오는 중…</p></div>
<script src="assets/site/ieum.js" defer></script>
</body>
</html>
