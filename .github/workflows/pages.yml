name: sync & deploy

# 매일 06:00 KST에 블로그 RSS·형제 저장소에서 data/ 를 새로 만들고 Pages로 배포한다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 데이터 동기화
        run: python scripts/sync_sources.py
      - name: 바뀐 데이터 커밋
        run: |
          if [ -n "$(git status --porcelain data assets/books)" ]; then
            git config user.name "joyhouse-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data assets/books
            git commit -m "데이터 자동 갱신 $(date -u +%F)"
            git push
          fi
      # 배포마다 코드 폴더 이름을 바꿔 브라우저가 예전 모듈을 캐시에서 꺼내 쓰지 않게 한다
      - name: 캐시 무효화
        run: |
          V=${GITHUB_SHA::7}
          mv src "src-$V"
          sed -i "s#src/main.js#src-$V/main.js#" index.html
          grep -q "src-$V/main.js" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
